<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SadaHisab — Article Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .prose h1 { font-size: 2rem; font-weight: 800; color: #00A86B; margin-bottom: 1rem; }
    .prose h2 { font-size: 1.45rem; font-weight: 700; color: #F8FAFC; margin-top: 2rem; margin-bottom: 0.6rem; border-bottom: 1px solid rgba(0,168,107,0.2); padding-bottom: 0.4rem; }
    .prose h3 { font-size: 1.2rem; font-weight: 600; color: #10B981; margin-top: 1.25rem; }
    .prose p { margin: 1rem 0; line-height: 1.85; color: #94A3B8; font-size: 0.95rem; }
    .prose ul { list-style-type: disc; padding-left: 1.5rem; margin: 1rem 0; color: #94A3B8; }
    .prose a { color: #00A86B; text-decoration: underline; font-weight: 600; }
    .prose img { width: 100%; border-radius: 1rem; margin: 1.5rem 0; border: 1px solid rgba(0,168,107,0.2); }
  </style>
</head>
<body class="bg-[#080C15] text-[#F8FAFC] min-h-screen py-10 px-4">
  <div class="max-w-3xl mx-auto">
    <div class="mb-8 flex items-center justify-between pb-4 border-b border-[#1E293B]">
      <a href="/" class="text-xs font-semibold text-[#00A86B] hover:underline">&larr; Back to Studio</a>
    </div>
    <article class="prose">
      {{ content | safe }}
    </article>
  </div>
</body>
</html>
